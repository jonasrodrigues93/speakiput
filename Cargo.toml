[workspace]
resolver = "2"
members = [
    "apps/speakiput",
    "apps/speakiputd",
    "crates/speakiput-audio",
    "crates/speakiput-asr",
    "crates/speakiput-client",
    "crates/speakiput-contract",
    "crates/speakiput-core",
    "crates/speakiput-llm",
    "crates/speakiput-platform",
    "crates/speakiput-platform-linux",
    "crates/speakiput-platform-linux-gui",
    "crates/speakiput-platform-macos",
    "crates/speakiput-platform-macos-gui",
    "crates/speakiput-storage",
    "crates/speakiput-testing",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/speakiput/speakiput"

[workspace.dependencies]
async-trait = "0.1.92"
ashpd = { version = "0.13.13", default-features = false, features = ["global_shortcuts", "tokio"] }
chrono = { version = "0.4.45", features = ["serde"] }
cpal = "0.15.3"
arboard = { version = "3.6.1", default-features = false }
enigo = { version = "0.6.1", default-features = false, features = ["platform_specific"] }
futures-util = "0.3.34"
hound = "3.5.1"
jsonschema = "0.49.9"
keyring = { version = "3.6.3", features = ["async-secret-service", "tokio", "crypto-rust"] }
macos-accessibility-client = "0.0.2"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls"] }
regex = "1.12.3"
rdev = { version = "0.5.3", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0"
slint = { version = "1.17.1", features = ["unstable-winit-030"] }
slint-build = "1.17.1"
thiserror = "2.0.20"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tokio = { version = "1.53.1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tempfile = "3.27.0"
toml = "1.1.4"
uuid = { version = "1.24.0", features = ["serde", "v4"] }
whisper-rs = "0.16.0"
xkb-type = { version = "0.1.4", features = ["arboard", "wayland-vk"] }

[workspace.lints.rust]
# Slint's generated bindings contain narrowly-scoped `allow(unsafe_code)`
# annotations. `deny` keeps unsafe code rejected in project sources while
# allowing those generated annotations to compile.
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
