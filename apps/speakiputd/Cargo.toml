[package]
name = "speakiputd"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
native = ["speakiput-audio/native-capture", "speakiput-asr/local-whisper"]
vulkan = ["native", "speakiput-asr/vulkan"]

[dependencies]
async-trait.workspace = true
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
speakiput-audio = { path = "../../crates/speakiput-audio" }
speakiput-asr = { path = "../../crates/speakiput-asr" }
speakiput-client = { path = "../../crates/speakiput-client" }
speakiput-contract = { path = "../../crates/speakiput-contract" }
speakiput-core = { path = "../../crates/speakiput-core" }
speakiput-llm = { path = "../../crates/speakiput-llm" }
speakiput-platform = { path = "../../crates/speakiput-platform" }
speakiput-platform-linux = { path = "../../crates/speakiput-platform-linux" }
speakiput-storage = { path = "../../crates/speakiput-storage" }
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
toml.workspace = true
uuid.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true

[[bench]]
name = "pipeline_benchmark"
harness = false
